x-cyxcel-db-volumes:
  &cyxcel-db-volumes
  - ${PROJECT_DATA_PATH}/db:/var/lib/postgresql/data

x-cyxcel-api-project-volumes:
  &cyxcel-api-project-volumes
  - ./app:/app # (loc)
  - cyxcel-api-core-node-modules:/app/node_modules # (loc) isolate deps inside container

volumes:
  cyxcel-api-core-node-modules:
    driver: local

services:
  cyxcel-api-nestjs:
    image: cyxcel-api-nestjs
    build:
      context: .
      dockerfile: ./docker/nestjs/Dockerfile
      args:
        - PROJECT_DIR=app
    env_file: .env.${ENV}
    command: sh -c "npm install && npm run prisma:generate && npm run start:dev" # comment this for production
    environment:
      - VIRTUAL_HOST=${API_VIRTUAL_HOST}
      - VIRTUAL_PORT=${API_VIRTUAL_PORT}
    volumes:
      *cyxcel-api-project-volumes
    depends_on:
      - cyxcel-db
    restart: "unless-stopped"

  cyxcel-migrations:
    image: cyxcel-api-nestjs
    command: npm run prisma:migrate:deploy
    env_file: .env.${ENV}
    depends_on:
      - cyxcel-db
    restart: "no"
    volumes:
      *cyxcel-api-project-volumes

  cyxcel-db:
    image: postgres:17.5-alpine
    restart: "unless-stopped"
    env_file: .env.${ENV}
    volumes:
      *cyxcel-db-volumes
    ports:
      - 5454:5432

  cyxcel-api-nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    environment:
      - VIRTUAL_HOST=${NGINX_VIRTUAL_HOST}
      - VIRTUAL_NETWORK=docker-proxy-overlay
      - BACKEND_URL=http://cyxcel-api-nestjs:3100
    restart: "unless-stopped"
    ports:
      - 8085:80

